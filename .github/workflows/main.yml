name: verademo

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: '20.14.0'

      - name: Zip app files
        run: | 
          rm -rf verademo-python.zip
          zip -r verademo-python.zip .

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with: 
          name: scan-target
          path: verademo-python.zip

  pipeline_scan:
    needs: build
    runs-on: ubuntu-latest
    name: Pipeline scan
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get archive
        uses: actions/download-artifact@v4
        with:
          name: scan-target

      - name: Pipeline-scan action step
        id: pipeline-scan
        uses: veracode/Veracode-pipeline-scan-action@esd-true
        with:
          vid: ${{ secrets.VID }}
          vkey: ${{ secrets.VKEY }}
          file: "verademo-python.zip"
          request_policy: "Veracode Recommended SCA Very Low"
          debug: 1
          fail_build: false

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-scan-results
          path: results.json

  veracode-fix:
    runs-on: ubuntu-latest
    needs: pipeline_scan
    name: Create fixes
    permissions: write-all
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get flaw file
        uses: actions/download-artifact@v4
        with:
          name: pipeline-scan-results

      - name: Create fixes from static findings
        id: convert
        uses: Veracode/veracode-fix@main
        with:
          inputFile: results.json
          vid: ${{ secrets.VID }}
          vkey: ${{ secrets.VKEY }}
          language: python
          createPR: true
          DEBUG: true
          fixType: batch
          files: all
          prComment: true
          cwe:89
